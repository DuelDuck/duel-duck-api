info:
  contact: {}
  description: This is a swagger specification for a Duel Duck back-end.
  title: Duel Duck API
  version: "1.0"
paths:
  /admin/advertiser-link:
    get:
      consumes:
      - application/json
      description: Allows an admin to retrieve all advertiser links. Supports filtering,
        sorting and pagination via query parameters. Requires admin authorization.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - default: 10
        description: Number of items per page
        in: query
        name: opts.pagination.page_size
        type: integer
      - default: 1
        description: Page number (starting from 1)
        in: query
        name: opts.pagination.page_num
        type: integer
      - description: Field to order by
        in: query
        name: opts.order.order_by
        type: string
      - default: '""'
        description: Order type
        enum:
        - desc
        - asc
        in: query
        name: opts.order.order_type
        type: string
      - description: Filter column name
        in: query
        name: opts.filters[0].column
        type: string
      - description: Filter operator
        in: query
        name: opts.filters[0].operator
        type: string
      - description: Filter value
        in: query
        name: opts.filters[0].value
        type: string
      - description: Filter OR condition
        in: query
        name: opts.filters[0].where_or
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of advertiser links
          schema:
            items:
              $ref: '#/definitions/model.AdvertiserLinkInfo'
            type: array
        "400":
          description: Invalid request params or query structure
          schema:
            $ref: '#/definitions/apperrors.ErrorPublic'
        "401":
          description: Authentication required or invalid token
          schema:
            $ref: '#/definitions/apperrors.ErrorPublic'
        "403":
          description: Access forbidden or insufficient permissions
          schema:
            $ref: '#/definitions/apperrors.ErrorPublic'
        "500":
          description: Internal server error during advertiser links retrieval
          schema:
            $ref: '#/definitions/apperrors.ErrorPublic'
      security:
      - BearerAuth: []
      summary: Get all advertiser links with filtering and pagination
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Allows an admin to create a new advertiser link with the given
        data. Requires admin authorization.
      parameters:
      - description: Authorization Bearer token
        in: header
        name: Authorization
        required: true
        type: string
